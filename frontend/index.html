<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trasolve - 여행 일정과 이동 경로를 한곳에서 설계하는 여행 계획 서비스"
    />
    <script>
      (() => {
        const storageKey = 'trasolve.theme';
        let mode = 'system';
        try {
          const storedMode = window.localStorage.getItem(storageKey);
          if (
            storedMode === 'light' ||
            storedMode === 'dark' ||
            storedMode === 'system'
          ) {
            mode = storedMode;
          }
        } catch {
          // System is the safe default when browser storage is unavailable.
        }
        const theme =
          mode === 'system'
            ? typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Trasolve</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/bootstrap/main.tsx"></script>
  </body>
</html>
