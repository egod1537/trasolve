<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#141629"/>
    </linearGradient>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".35"/></filter>
    <marker id="a4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#60a5fa"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #f8fafc; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 18px; fill: #94a3b8; }
      .num { font-size: 22px; font-weight: 700; fill: #061224; }
      .head { font-size: 24px; font-weight: 700; }
      .body { font-size: 17px; fill: #cbd5e1; }
      .tag { font-size: 15px; fill: #bfdbfe; }
      .arrow { fill: none; stroke: #60a5fa; stroke-width: 5; marker-end: url(#a4); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>
  <circle cx="150" cy="770" r="260" fill="#2563eb" opacity=".08"/>
  <circle cx="1480" cy="110" r="250" fill="#8b5cf6" opacity=".08"/>
  <text class="title" x="70" y="72">방문 순서 최적화 처리 과정</text>
  <text class="sub" x="70" y="108">관광지 선택부터 이동 시간 수집, 순서 계산, 일정 조건 검증과 사용자 적용까지</text>

  <path class="arrow" d="M290 278 H430"/>
  <path class="arrow" d="M715 278 H855"/>
  <path class="arrow" d="M1140 278 H1275"/>
  <path class="arrow" d="M1410 390 C1410 520 1180 520 1130 600"/>
  <path class="arrow" d="M855 670 H715"/>

  <g filter="url(#s4)">
    <rect x="60" y="170" width="300" height="220" rx="24" fill="#102b4d" stroke="#38bdf8"/>
    <circle cx="105" cy="215" r="25" fill="#7dd3fc"/><text class="num" x="98" y="223">1</text>
    <text class="head" x="145" y="223">관광지 선택</text>
    <text class="body" x="92" y="275">장소 검색과 상세 정보 조회</text>
    <text class="body" x="92" y="309">날짜별 Day·레이어에 추가</text>
    <rect x="92" y="337" width="190" height="30" rx="15" fill="#0b1d34"/><text class="tag" x="110" y="358">Places API · Trip Store</text>

    <rect x="430" y="170" width="300" height="220" rx="24" fill="#17264e" stroke="#818cf8"/>
    <circle cx="475" cy="215" r="25" fill="#a5b4fc"/><text class="num" x="468" y="223">2</text>
    <text class="head" x="515" y="223">입력 정규화</text>
    <text class="body" x="462" y="275">출발·도착 고정 여부 확인</text>
    <text class="body" x="462" y="309">체류 시간·시작 시각 구성</text>
    <rect x="462" y="337" width="205" height="30" rx="15" fill="#10183a"/><text class="tag" x="480" y="358">공용 Schema · Validation</text>

    <rect x="855" y="170" width="300" height="220" rx="24" fill="#123645" stroke="#2dd4bf"/>
    <circle cx="900" cy="215" r="25" fill="#5eead4"/><text class="num" x="893" y="223">3</text>
    <text class="head" x="940" y="223">이동 시간 확인</text>
    <text class="body" x="887" y="275">장소 쌍별 이동 시간 조회</text>
    <text class="body" x="887" y="309">캐시 적중 시 저장 결과 재사용</text>
    <rect x="887" y="337" width="210" height="30" rx="15" fill="#0d2932"/><text class="tag" x="918" y="358">tcache · 교통 제공자</text>

    <rect x="1275" y="170" width="265" height="220" rx="24" fill="#34235a" stroke="#a78bfa"/>
    <circle cx="1320" cy="215" r="25" fill="#c4b5fd"/><text class="num" x="1313" y="223">4</text>
    <text class="head" x="1360" y="223">순서 계산</text>
    <text class="body" x="1307" y="275">후보 방문 순서 생성</text>
    <text class="body" x="1307" y="309">총 이동 비용 비교</text>
    <rect x="1307" y="337" width="165" height="30" rx="15" fill="#24183f"/><text class="tag" x="1358" y="358">troute</text>

    <rect x="855" y="570" width="300" height="220" rx="24" fill="#3c2732" stroke="#fb7185"/>
    <circle cx="900" cy="615" r="25" fill="#fda4af"/><text class="num" x="893" y="623">5</text>
    <text class="head" x="940" y="623">일정 조건 검증</text>
    <text class="body" x="887" y="675">영업시간·체류 시간 검사</text>
    <text class="body" x="887" y="709">불가능한 일정과 원인 분류</text>
    <rect x="887" y="737" width="215" height="30" rx="15" fill="#2c1c27"/><text class="tag" x="916" y="758">Schedule · Constraints</text>

    <rect x="430" y="570" width="300" height="220" rx="24" fill="#183c33" stroke="#4ade80"/>
    <circle cx="475" cy="615" r="25" fill="#86efac"/><text class="num" x="468" y="623">6</text>
    <text class="head" x="515" y="623">결과 표시·적용</text>
    <text class="body" x="462" y="675">현재·최적화 일정 비교</text>
    <text class="body" x="462" y="709">사용자 확인 후 일정 저장</text>
    <rect x="462" y="737" width="215" height="30" rx="15" fill="#102b25"/><text class="tag" x="485" y="758">Preview · Command 적용</text>
  </g>

  <rect x="60" y="472" width="520" height="62" rx="18" fill="#0b1220" stroke="#334155"/>
  <circle cx="93" cy="503" r="9" fill="#38bdf8"/><text class="sub" x="116" y="510">요청·진행·완료 상태를 SSE로 UI에 전달</text>
  <rect x="1030" y="472" width="510" height="62" rx="18" fill="#0b1220" stroke="#334155"/>
  <circle cx="1063" cy="503" r="9" fill="#fb7185"/><text class="sub" x="1086" y="510">실패 시 단계와 해결 가능한 사유를 보존</text>

  <text class="sub" x="70" y="850">결과는 자동 반영되지 않습니다. 사용자가 비교 화면에서 확인한 뒤 “이 결과 적용”을 선택해야 공통 여행 편집 경로로 저장됩니다.</text>
</svg>
