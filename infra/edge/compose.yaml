name: jjs-edge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    container_name: jjs-edge-postgres
    environment:
      POSTGRES_DB: trasolve
      POSTGRES_USER: trasolve
      POSTGRES_PASSWORD: ${JJS_POSTGRES_PASSWORD:?set JJS_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      jjs-edge:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trasolve -d trasolve"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    container_name: jjs-edge-caddy
    command: ["caddy", "run", "--config", "/etc/caddy/jjs-edge/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      # Mount the stable directory. A Git branch switch can replace a single
      # bind-mounted file inode and leave Docker Desktop with a stale mount.
      - ./:/etc/caddy/jjs-edge:ro
      - ${JJS_STATE_DIR:?set JJS_STATE_DIR}/routes:/etc/caddy/routes:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      jjs-edge:
        aliases: [caddy]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/jjs-edge/Caddyfile", "--adapter", "caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: jjs-edge-cloudflared
    command: ["--config", "/etc/cloudflared/config.yml", "tunnel", "run"]
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      - ${JJS_CLOUDFLARED_CONFIG_PATH:?set JJS_CLOUDFLARED_CONFIG_PATH}:/etc/cloudflared/config.yml:ro
      - ${JJS_CLOUDFLARED_CREDENTIALS:?set JJS_CLOUDFLARED_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    networks: [jjs-edge]
    logging: *default-logging
    restart: unless-stopped

networks:
  jjs-edge:
    name: jjs-edge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
