services:
  backend:
    image: ${JJS_BACKEND_IMAGE:?set JJS_BACKEND_IMAGE}
    build:
      context: ${JJS_WORKTREE:?set JJS_WORKTREE}
      dockerfile: infra/docker/backend.Dockerfile
      labels:
        net.mangagaki.jjs.deployment-image: 'true'
        net.mangagaki.jjs.branch-slug: ${JJS_BRANCH_SLUG:?set JJS_BRANCH_SLUG}
        net.mangagaki.jjs.commit: ${JJS_COMMIT_SHA:?set JJS_COMMIT_SHA}
    container_name: jjs-${JJS_BRANCH_SLUG}-backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRASOLVE_EXTERNAL_API_MODE: ${TRASOLVE_EXTERNAL_API_MODE:-enabled}
      TRASOLVE_EXTERNAL_API_MOCK_ALLOW_PRODUCTION: ${TRASOLVE_EXTERNAL_API_MOCK_ALLOW_PRODUCTION:-false}
      DATABASE_URL: postgresql://trasolve:${JJS_POSTGRES_PASSWORD:?set JJS_POSTGRES_PASSWORD}@postgres:5432/${JJS_DATABASE_NAME:?set JJS_DATABASE_NAME}
      TRASOLVE_DEBUG_GUEST_AUTH: ${JJS_DEBUG_GUEST_AUTH:-false}
      TRASOLVE_DEBUG_GUEST_SUBJECT: ${JJS_BRANCH_SLUG:-default}
      TRASOLVE_DEBUG_PAYMENTS: ${TRASOLVE_DEBUG_PAYMENTS:-false}
      TOSS_PAYMENTS_CLIENT_KEY: ${TOSS_PAYMENTS_CLIENT_KEY:-}
      TOSS_PAYMENTS_SECRET_KEY: ${TOSS_PAYMENTS_SECRET_KEY:-}
      TOSS_BILLING_CLIENT_KEY: ${TOSS_BILLING_CLIENT_KEY:-}
      TOSS_BILLING_SECRET_KEY: ${TOSS_BILLING_SECRET_KEY:-}
      TRASOLVE_PAYMENT_ENCRYPTION_KEY: ${TRASOLVE_PAYMENT_ENCRYPTION_KEY:-}
      TRASOLVE_TOKEN_CHAT_COST: ${TRASOLVE_TOKEN_CHAT_COST:-10}
      TRASOLVE_TOKEN_OPTIMIZE_COST: ${TRASOLVE_TOKEN_OPTIMIZE_COST:-50}
      TRASOLVE_PLUS_PRICE: ${TRASOLVE_PLUS_PRICE:-4900}
      TRASOLVE_PRO_PRICE: ${TRASOLVE_PRO_PRICE:-9900}
      TRASOLVE_TOPUP_20K_PRICE: ${TRASOLVE_TOPUP_20K_PRICE:-4900}
      TRASOLVE_TOPUP_50K_PRICE: ${TRASOLVE_TOPUP_50K_PRICE:-9900}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: https://${JJS_HOSTNAME:?set JJS_HOSTNAME}/api/auth/google/callback
      TRASOLVE_ADMIN_CSRF_SECRET: ${TRASOLVE_ADMIN_CSRF_SECRET:-}
      TRASOLVE_PUBLIC_ORIGIN: https://${JJS_HOSTNAME:?set JJS_HOSTNAME}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_MODEL: ${OPENWEBUI_MODEL:-}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${CLOUDFLARE_ACCESS_CLIENT_ID:-}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}
      TROUTE_BASE_URL: ${TROUTE_BASE_URL:-https://troute.mangagaki.net/api/}
      TCACHE_BASE_URL: ${TCACHE_BASE_URL:-https://tcache.mangagaki.net}
      TRASOLVE_DATA_DIR: /data
    volumes:
      - ./runtime/trasolve:/data
    networks: [jjs-edge]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    labels:
      net.mangagaki.jjs.branch: ${JJS_BRANCH:?set JJS_BRANCH}
      net.mangagaki.jjs.branch-slug: ${JJS_BRANCH_SLUG}
      net.mangagaki.jjs.commit: ${JJS_COMMIT_SHA}
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    restart: unless-stopped

  frontend:
    image: ${JJS_FRONTEND_IMAGE:?set JJS_FRONTEND_IMAGE}
    build:
      context: ${JJS_WORKTREE}
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_EXTERNAL_API_MODE: ${VITE_EXTERNAL_API_MODE:-enabled}
        VITE_GOOGLE_MAPS_API_KEY: ${JJS_GOOGLE_MAPS_API_KEY:?set JJS_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${JJS_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
        VITE_SENTRY_DSN: ${JJS_SENTRY_DSN:-}
        VITE_BUILD_CHANNEL: ${VITE_BUILD_CHANNEL:-}
        VITE_GIT_BRANCH: ${VITE_GIT_BRANCH:-}
        VITE_GIT_SHA: ${VITE_GIT_SHA:-}
        VITE_GIT_REPOSITORY_URL: ${VITE_GIT_REPOSITORY_URL:-}
      labels:
        net.mangagaki.jjs.deployment-image: 'true'
        net.mangagaki.jjs.branch-slug: ${JJS_BRANCH_SLUG}
        net.mangagaki.jjs.commit: ${JJS_COMMIT_SHA}
    container_name: jjs-${JJS_BRANCH_SLUG}-frontend
    networks: [jjs-edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    labels:
      net.mangagaki.jjs.branch: ${JJS_BRANCH}
      net.mangagaki.jjs.branch-slug: ${JJS_BRANCH_SLUG}
      net.mangagaki.jjs.commit: ${JJS_COMMIT_SHA}
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    restart: unless-stopped

networks:
  jjs-edge:
    name: jjs-edge
    external: true
