name: Code quality

on:
  pull_request:
    branches:
      - main
      - w1
      - impl

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check frontend architecture
        run: npm run architecture:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check formatting
        run: npm run format:check
