name: trasolve-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRASOLVE_PERSISTENCE_MODE: ${TRASOLVE_PERSISTENCE_MODE:-local}
      DATABASE_URL: ${DATABASE_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_MODEL: ${OPENWEBUI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      TROUTE_BASE_URL: ${TROUTE_BASE_URL:-http://host.docker.internal:18080}
      TCACHE_BASE_URL: ${TCACHE_BASE_URL:-http://host.docker.internal:3200}
      TRASOLVE_DATA_DIR: /data
    ports:
      - '${BACKEND_PORT:-43127}:3000'
    volumes:
      - backend-data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        FRONTEND_CADDYFILE: infra/docker/frontend.dev.Caddyfile
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
        VITE_BUILD_CHANNEL: local
    ports:
      - '${FRONTEND_PORT:-4173}:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
