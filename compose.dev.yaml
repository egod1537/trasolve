name: trasolve-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRASOLVE_EXTERNAL_API_MODE: ${TRASOLVE_EXTERNAL_API_MODE:-enabled}
      TRASOLVE_EXTERNAL_API_MOCK_ALLOW_PRODUCTION: ${TRASOLVE_EXTERNAL_API_MOCK_ALLOW_PRODUCTION:-false}
      TRASOLVE_PERSISTENCE_MODE: ${TRASOLVE_PERSISTENCE_MODE:-local}
      TRASOLVE_DEBUG_PAYMENTS: ${TRASOLVE_DEBUG_PAYMENTS:-true}
      TRASOLVE_TOKEN_MULTIPLIER: ${TRASOLVE_TOKEN_MULTIPLIER:-1}
      TRASOLVE_TOKEN_CHAT_MULTIPLIER: ${TRASOLVE_TOKEN_CHAT_MULTIPLIER:-1}
      TRASOLVE_TOKEN_OPTIMIZE_MULTIPLIER: ${TRASOLVE_TOKEN_OPTIMIZE_MULTIPLIER:-1}
      TRASOLVE_TOKEN_OPTIMIZE_COST: ${TRASOLVE_TOKEN_OPTIMIZE_COST:-50}
      TRASOLVE_TOKEN_ROUTE_REFERENCE_PLACES: ${TRASOLVE_TOKEN_ROUTE_REFERENCE_PLACES:-10}
      TRASOLVE_TOKEN_ROUTE_DOUBLING_PLACES: ${TRASOLVE_TOKEN_ROUTE_DOUBLING_PLACES:-10}
      TRASOLVE_TOKEN_ROUTE_MAX_COST: ${TRASOLVE_TOKEN_ROUTE_MAX_COST:-10000000}
      TRASOLVE_TOKEN_USD_PER_TOKEN: ${TRASOLVE_TOKEN_USD_PER_TOKEN:-0.0001}
      TRASOLVE_TOKEN_CHAT_MAX_COST: ${TRASOLVE_TOKEN_CHAT_MAX_COST:-1000}
      TRASOLVE_TOKEN_AI_INPUT_USD_PER_MILLION: ${TRASOLVE_TOKEN_AI_INPUT_USD_PER_MILLION:-1}
      TRASOLVE_TOKEN_AI_OUTPUT_USD_PER_MILLION: ${TRASOLVE_TOKEN_AI_OUTPUT_USD_PER_MILLION:-5}
      TRASOLVE_TOKEN_AI_CACHED_INPUT_USD_PER_MILLION: ${TRASOLVE_TOKEN_AI_CACHED_INPUT_USD_PER_MILLION:-0.1}
      TRASOLVE_TOKEN_MODEL_RATES: '${TRASOLVE_TOKEN_MODEL_RATES:-}'
      DATABASE_URL: ${DATABASE_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      TRASOLVE_ADMIN_CSRF_SECRET: ${TRASOLVE_ADMIN_CSRF_SECRET:-}
      TRASOLVE_PUBLIC_ORIGIN: ${TRASOLVE_PUBLIC_ORIGIN:-http://127.0.0.1:4173}
      TRASOLVE_LEGAL_OPERATOR_NAME: ${TRASOLVE_LEGAL_OPERATOR_NAME:-}
      TRASOLVE_PRIVACY_CONTACT_EMAIL: ${TRASOLVE_PRIVACY_CONTACT_EMAIL:-}
      TOSS_PAYMENTS_CLIENT_KEY: ${TOSS_PAYMENTS_CLIENT_KEY:-}
      TOSS_PAYMENTS_SECRET_KEY: ${TOSS_PAYMENTS_SECRET_KEY:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${CLOUDFLARE_ACCESS_CLIENT_ID:-}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      TROUTE_BASE_URL: ${TROUTE_BASE_URL:-http://host.docker.internal:18080}
      TCACHE_BASE_URL: ${TCACHE_BASE_URL:-http://host.docker.internal:3200}
      TRASOLVE_DATA_DIR: /data
    ports:
      - '${BACKEND_PORT:-43127}:3000'
    volumes:
      - backend-data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        FRONTEND_CADDYFILE: infra/docker/frontend.dev.Caddyfile
        VITE_EXTERNAL_API_MODE: ${VITE_EXTERNAL_API_MODE:-enabled}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
        VITE_BUILD_CHANNEL: local
    ports:
      - '${FRONTEND_PORT:-4173}:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
